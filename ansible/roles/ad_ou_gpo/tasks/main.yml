---
- name: Créer les OU
  microsoft.ad.ou:
    name: "{{ item.name }}"
    path: "{{ item.path }}"
    state: present
  loop: "{{ ad_ous }}"

- name: Créer les GPO
  ansible.windows.win_shell: |
    if (-not (Get-GPO -Name "{{ item.name }}" -ErrorAction SilentlyContinue)) {
      New-GPO -Name "{{ item.name }}" | Out-Null
    }
  loop: "{{ ad_gpos }}"
  changed_when: true

- name: Lier les GPO aux OU
  ansible.windows.win_shell: |
    $existing = (Get-GPInheritance -Target "{{ item.ou_path }}").GpoLinks | Where-Object { $_.DisplayName -eq "{{ item.gpo }}" }
    if (-not $existing) {
      New-GPLink -Name "{{ item.gpo }}" -Target "{{ item.ou_path }}"
      Write-Output "created"
    } else {
      Write-Output "already_linked"
    }
  loop: "{{ ad_gpo_links }}"
  register: gpo_link_result
  changed_when: "'created' in gpo_link_result.stdout"